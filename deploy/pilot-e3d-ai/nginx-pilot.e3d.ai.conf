# /etc/nginx/sites-available/pilot.e3d.ai  (certbot --nginx adds the TLS server block and the http->https redirect)
# Needs this once in the http{} context (installed by install.sh as /etc/nginx/conf.d/pilot-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=pilot:10m rate=20r/m;

server {
    listen 80;
    server_name pilot.e3d.ai;

    client_max_body_size 64k;

    # Only the MCP endpoint and the health check are proxied; everything else is a 404 so nothing else on the
    # loopback service can be reached through this host name.
    location = /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    location = /mcp {
        limit_req zone=pilot burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404;
    }
}
