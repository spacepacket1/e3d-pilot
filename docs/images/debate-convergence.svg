<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="e3d-debate: independent AI models answer, critique each other, converge on a synthesis, then hand off to human-gated execution and provenance">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1a1240"/>
      <stop offset="45%" stop-color="#0b0d2e"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37e6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#37e6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c14bff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#c14bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeCyan" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d6fbff"/>
      <stop offset="35%" stop-color="#37e6ff"/>
      <stop offset="100%" stop-color="#0c6b8a"/>
    </radialGradient>
    <radialGradient id="nodeMagenta" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe0f6"/>
      <stop offset="35%" stop-color="#ff5ec4"/>
      <stop offset="100%" stop-color="#7a1e63"/>
    </radialGradient>
    <radialGradient id="nodeGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff6d9"/>
      <stop offset="35%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#8a5a06"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#8be9ff"/>
      <stop offset="100%" stop-color="#8be9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18"/>
    </filter>
    <marker id="arrowHead2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8be9ff"/>
    </marker>
    <marker id="arrowHeadGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/>
    </marker>

    <g id="icon-check">
      <path d="M -6.5 0.5 L -1.5 6 L 7 -6.5" fill="none" stroke="#04222b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-person">
      <circle cx="0" cy="-4.4" r="4" fill="none" stroke="#3a2a02" stroke-width="2"/>
      <path d="M -7.5 8.5 C -7.5 1.5 7.5 1.5 7.5 8.5" fill="none" stroke="#3a2a02" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="icon-gear-small">
      <polygon points="0,-8 6.9,-4 6.9,4 0,8 -6.9,4 -6.9,-4" fill="none" stroke="#04222b" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.6" fill="#04222b"/>
    </g>
    <g id="icon-node-graph">
      <circle cx="-5.5" cy="-5" r="2.4" fill="#04222b"/>
      <circle cx="5.5" cy="-5" r="2.4" fill="#04222b"/>
      <circle cx="0" cy="6" r="2.4" fill="#04222b"/>
      <line x1="-5.5" y1="-5" x2="5.5" y2="-5" stroke="#04222b" stroke-width="1.6"/>
      <line x1="-5.5" y1="-5" x2="0" y2="6" stroke="#04222b" stroke-width="1.6"/>
      <line x1="5.5" y1="-5" x2="0" y2="6" stroke="#04222b" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- scene backdrop -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="260" cy="150" r="260" fill="url(#nebulaMagenta)"/>
  <circle cx="960" cy="120" r="300" fill="url(#nebulaCyan)"/>

  <!-- starfield -->
  <g>
    <circle cx="395.6" cy="76.1" r="1.5" fill="#cfe9ff" opacity="0.3"/>
    <circle cx="641.6" cy="163.1" r="0.7" fill="#cfe9ff" opacity="0.58"/>
    <circle cx="63.5" cy="190.6" r="0.7" fill="#cfe9ff" opacity="0.31"/>
    <circle cx="512.4" cy="349.9" r="0.8" fill="#cfe9ff" opacity="0.4"/>
    <circle cx="747.8" cy="398.8" r="1.4" fill="#cfe9ff" opacity="0.51"/>
    <circle cx="1152.5" cy="33.9" r="1.8" fill="#cfe9ff" opacity="0.44"/>
    <circle cx="187.3" cy="62.7" r="1.0" fill="#cfe9ff" opacity="0.78"/>
    <circle cx="229.6" cy="250.5" r="1.5" fill="#cfe9ff" opacity="0.49"/>
    <circle cx="655.4" cy="40.4" r="0.7" fill="#cfe9ff" opacity="0.38"/>
    <circle cx="809.3" cy="188.2" r="1.0" fill="#cfe9ff" opacity="0.63"/>
    <circle cx="545.7" cy="136.4" r="1.7" fill="#cfe9ff" opacity="0.7"/>
    <circle cx="303.2" cy="247.6" r="1.3" fill="#cfe9ff" opacity="0.82"/>
    <circle cx="866.2" cy="131.6" r="2.0" fill="#cfe9ff" opacity="0.33"/>
    <circle cx="1035.6" cy="142.1" r="1.6" fill="#cfe9ff" opacity="0.64"/>
    <circle cx="118.3" cy="282.5" r="1.9" fill="#cfe9ff" opacity="0.76"/>
    <circle cx="890.2" cy="208.6" r="0.9" fill="#cfe9ff" opacity="0.76"/>
    <circle cx="994.9" cy="209.2" r="1.5" fill="#cfe9ff" opacity="0.77"/>
    <circle cx="167.4" cy="76.2" r="1.9" fill="#cfe9ff" opacity="0.77"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#8be9ff" stroke-width="2.5" fill="none" opacity="0.65">
    <polyline points="26,70 26,26 70,26"/>
    <polyline points="1130,26 1174,26 1174,70"/>
    <polyline points="26,560 26,604 70,604"/>
    <polyline points="1130,604 1174,604 1174,560"/>
  </g>

  <!-- round labels -->
  <g font-size="14" font-weight="700" letter-spacing="2" fill="#8be9ff" opacity="0.55">
    <text x="600" y="95" text-anchor="middle">ROUND 1 &#183; INDEPENDENT ANSWERS</text>
    <text x="600" y="205" text-anchor="middle">ROUND 2+ &#183; CRITIQUE, REBUT, OR CONVERGE</text>
  </g>

  <!-- soft halo behind the model constellation -->
  <ellipse cx="600" cy="230" rx="330" ry="150" fill="none" stroke="#37e6ff" stroke-width="26" opacity="0.10" filter="url(#softBlur)"/>

  <!-- four independent models, round 1 -->
  <g filter="url(#glow)">
    <circle cx="330" cy="150" r="40" fill="url(#nodeCyan)" stroke="#eafcff" stroke-width="1.5"/>
    <circle cx="870" cy="150" r="40" fill="url(#nodeMagenta)" stroke="#fff0fb" stroke-width="1.5"/>
    <circle cx="330" cy="330" r="40" fill="url(#nodeMagenta)" stroke="#fff0fb" stroke-width="1.5"/>
    <circle cx="870" cy="330" r="40" fill="url(#nodeCyan)" stroke="#eafcff" stroke-width="1.5"/>
  </g>
  <g font-size="18" font-weight="700" letter-spacing="1" fill="#eafcff">
    <text x="330" y="118" text-anchor="middle">CLAUDE</text>
    <text x="870" y="118" text-anchor="middle">CODEX</text>
    <text x="330" y="378" text-anchor="middle">GROK</text>
    <text x="870" y="378" text-anchor="middle">DEVIN</text>
  </g>

  <!-- round 2: crossing critique lines between all four models -->
  <g stroke="#ff8fdd" stroke-width="1.4" opacity="0.5" fill="none">
    <line x1="330" y1="150" x2="870" y2="150"/>
    <line x1="330" y1="330" x2="870" y2="330"/>
    <line x1="330" y1="150" x2="870" y2="330"/>
    <line x1="870" y1="150" x2="330" y2="330"/>
  </g>

  <!-- convergence: all four flow down into the synthesis core -->
  <g stroke="#8be9ff" stroke-width="2" opacity="0.85" fill="none" marker-end="url(#arrowHead2)">
    <path d="M 345 185 C 420 260, 500 300, 562 330"/>
    <path d="M 855 185 C 780 260, 700 300, 638 330"/>
    <path d="M 345 305 C 420 320, 500 330, 562 335"/>
    <path d="M 855 305 C 780 320, 700 330, 638 335"/>
  </g>

  <!-- synthesis / consensus core -->
  <circle cx="600" cy="360" r="50" fill="url(#coreGlow)" opacity="0.9"/>
  <g filter="url(#glow)">
    <circle cx="600" cy="360" r="38" fill="url(#nodeGold)" stroke="#fff6d9" stroke-width="1.5"/>
    <use href="#icon-node-graph" transform="translate(600 360) scale(1.6)"/>
  </g>
  <text x="600" y="424" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.5" fill="#eafcff">SYNTHESIS</text>
  <text x="600" y="446" text-anchor="middle" font-size="12.5" letter-spacing="1" fill="#ffd166" opacity="0.9">CONSENSUS + NAMED DISSENT</text>

  <!-- hand-off: synthesis -> human decision -> execution/provenance -->
  <line x1="600" y1="398" x2="600" y2="470" stroke="#ffd166" stroke-width="2.2" marker-end="url(#arrowHeadGold)"/>

  <g filter="url(#glow)">
    <circle cx="600" cy="500" r="34" fill="url(#nodeGold)" stroke="#fff6d9" stroke-width="1.5"/>
    <use href="#icon-person" transform="translate(600 500) scale(1.6)"/>
  </g>
  <text x="600" y="550" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.5" fill="#eafcff">HUMAN DECISION</text>

  <line x1="634" y1="500" x2="900" y2="500" stroke="#8be9ff" stroke-width="2" opacity="0.75" marker-end="url(#arrowHead2)"/>
  <g filter="url(#glow)">
    <circle cx="940" cy="500" r="30" fill="url(#nodeCyan)" stroke="#eafcff" stroke-width="1.5"/>
    <use href="#icon-gear-small" transform="translate(940 500) scale(1.4)"/>
  </g>
  <text x="940" y="547" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#eafcff">EXECUTE &#8594;</text>
  <text x="940" y="563" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#eafcff">PROVENANCE</text>

  <!-- caption -->
  <text x="600" y="605" text-anchor="middle" font-size="15" letter-spacing="3" fill="#8be9ff" opacity="0.75">INDEPENDENT ANSWERS &#183; CRITIQUE &#183; CONVERGENCE &#183; HUMAN-GATED EXECUTION</text>
</svg>
