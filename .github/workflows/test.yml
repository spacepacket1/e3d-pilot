name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install jq and bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq bash
      - name: Git defaults the tests expect
        # Several tests run `git init` and then diff against `main`; a stock runner defaults to `master`.
        run: git config --global init.defaultBranch main
      - name: Offline test suite
        run: npm test

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
